<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Game List</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            color: white;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ffaa00;
            text-shadow: 4px 4px 0px #ff0000;
            margin-top: 60px;
            margin-bottom: 50px;
            font-size: 40px;
            text-align: center;
            letter-spacing: 5px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .game-card {
            background: #1f2833;
            border: 4px solid #45a29e;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #66fcf1;
            box-shadow: 0 15px 30px rgba(102, 252, 241, 0.3);
            background: #2a3746;
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 18px;
            line-height: 1.5;
            color: #66fcf1;
            margin-bottom: 10px;
        }

        .game-status {
            font-size: 12px;
            color: #c5c6c7;
        }

        /* Kartu Game Kosong (Coming Soon) */
        .game-card.disabled {
            border-color: #555;
            background: #111;
            cursor: not-allowed;
        }
        .game-card.disabled .game-title { color: #555; }
        .game-card.disabled:hover { transform: none; box-shadow: none; background: #111; }

        /* Tombol Kembali */
        .btn-back {
            background-color: #c3073f;
            color: white;
            text-decoration: none;
            padding: 20px 40px;
            border: 4px solid #950740;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.2s;
            box-shadow: 0 5px 0px #6f002b;
        }

        .btn-back:hover {
            background-color: #ff0044;
            border-color: #ff3366;
        }

        .btn-back:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px #6f002b;
        }
    </style>
</head>
<body>

    <h1>SELECT GAME</h1>

    <div class="game-grid">
        <a href="space_defender.html" class="game-card">
            <div class="game-icon">🛸</div>
            <div class="game-title">SPACE DEFENDER</div>
            <div class="game-status">▶ PLAY NOW</div>
        </a>

        <a href="maze_runner/index.html" class="game-card">
            <div class="game-icon">🧱</div>
            <div class="game-title">MAZE RUNNER 3D</div>
            <div class="game-status">▶ PLAY NOW</div>
        </a>

        <a href="super_mario/index.html" class="game-card">
            <div class="game-icon">🏃‍♀️‍➡️</div>
            <div class="game-title">HARUSNYA SUPER MARIO</div>
            <div class="game-status">▶ PLAY NOW</div>
        </a>

        <a href="matching_string/bggame.html" class="game-card">
            <div class="game-icon">🆎</div>
            <div class="game-title">MATCHING STRING</div>
            <div class="game-status">▶ PLAY NOW</div>
        </a>
    </div>

    <a href="index.html" class="btn-back">⬅ RETURN TO ARCADE HUB</a>

</body>
</html>
